<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Driver Dashboard - TangoLyft</title>
  <link rel="stylesheet" href="./driver.css" />
</head>
<body>

  <div class="container">
    <div class="card">

      <h1>Driver Dashboard</h1>
      <p class="subtitle">Go online, manage assigned trips, view earnings, and request payouts.</p>

      <div id="message"></div>

      <div class="form-group">
        <label>Status</label>
        <div id="driverStatus">
          OFFLINE
        </div>
      </div>

      <button id="goOnlineBtn" class="btn-primary">
        Go Online
      </button>

      <button
        id="goOfflineBtn"
        class="btn-primary"
        style="margin-top:12px;background:#d33;"
      >
        Go Offline
      </button>

      <hr style="margin:30px 0;" />

      <h2>Assigned Trip</h2>

      <div id="tripCard">
        No assigned trip at the moment.
      </div>

      <hr style="margin:30px 0;" />

      <details class="earnings-panel">
        <summary>
          Earnings, Wallet & Payouts
        </summary>

        <div class="earnings-content">
          <h2>Wallet</h2>

          <div id="walletCard" class="trip-box">
            Loading wallet...
          </div>

          <div class="form-group" style="margin-top:18px;">
            <label>Payout Amount</label>
            <input type="number" id="cashoutAmount" min="1" placeholder="Enter amount, e.g. 1728" />
          </div>

          <button id="requestCashoutBtn" class="btn-primary">
            Request Payout
          </button>

          <hr style="margin:30px 0;" />

          <h2>Recent Wallet Transactions</h2>

          <div id="walletTransactionsCard">
            Loading transactions...
          </div>
        </div>
      </details>

    </div>
  </div>

  <script src="./driver.js"></script>
</body>
</html>
